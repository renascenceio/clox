<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14171C" />
    <title>Omma · offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #14171C; color: #F6F4EF; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box; text-align: center;
      }
      main { max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
      h1 { font-size: 20px; font-weight: 600; margin: 8px 0 0; }
      p { margin: 0; font-size: 15px; line-height: 1.5; color: rgba(246, 244, 239, 0.72); }
      button {
        margin-top: 8px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px;
        background: #36B5AC; color: #14171C; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="-11.4 -11.6 22.63 23.9" width="54" height="57" aria-hidden="true">
        <polygon points="1.6,9.6 -5.33,5.6 -5.33,-2.4 1.6,-6.4 8.53,-2.4 8.53,5.6" fill="none" stroke="#F6F4EF" stroke-width="3" stroke-linejoin="round" />
        <polygon points="-7.6,-4.4 -10.2,-5.9 -10.2,-8.9 -7.6,-10.4 -5,-8.9 -5,-5.9" fill="#36B5AC" />
      </svg>
      <h1>You&rsquo;re offline</h1>
      <p>Omma needs a connection to reach your chats. Your work is saved; it&rsquo;ll be here when you&rsquo;re back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener('online', function () { location.reload() })</script>
  </body>
</html>
